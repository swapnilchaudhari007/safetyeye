name: 🐛 Bug report
description: Report something broken in SafetyEye
title: '[Bug]: '
labels:
- bug
body:
- type: input
  id: area
  attributes:
    label: Affected area
    description: e.g. PPE detection (helmet / vest), Restricted zones, Fall detection
  validations:
    required: true
- type: textarea
  id: what
  attributes:
    label: What happened?
    description: What did you expect, and what happened instead?
  validations:
    required: true
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    placeholder: "1. \n2. \n3. "
  validations:
    required: true
- type: dropdown
  id: detection
  attributes:
    label: Type of problem
    options:
    - Missed detection (false negative)
    - False alarm (false positive)
    - Crash / error
    - Performance / FPS
    - Other
- type: textarea
  id: logs
  attributes:
    label: Logs or screenshots
    description: Remove keys, tokens and personal data first.
    render: shell
